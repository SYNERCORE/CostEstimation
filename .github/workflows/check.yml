name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax + render tree structure
        run: node tools/check-render-tree.js
      - name: No calls to undefined project functions
        run: node tools/check-undefined-calls.js
      - name: Service worker precaches every app script
        run: node tools/check-sw-precache.js
      - name: Printed CE escapes all user text
        run: node tools/check-print-escaping.js
      - name: The two Status fields map onto each other
        run: node tools/check-status-sync.js
      - name: Every SharePoint column written is one the app creates
        run: node tools/check-sp-schema.js
      - name: SharePoint permission failures are named, not swallowed
        run: node tools/test-sp-permissions.js
      - name: Local caches survive empty SharePoint responses
        run: node tools/test-cache-preservation.js
      - name: Reference data renders offline from cache
        run: node tools/test-offline-first.js
      - name: CE archive migration is safe and idempotent
        run: node tools/test-migration.js
      - name: Offline CEs sync when the connection returns
        run: node tools/test-reconnect-sync.js
      - name: Unreachable SharePoint is never read as "no data"
        run: node tools/test-sp-failure-mode.js
      - name: Owner role cannot be taken by a delegated admin
        run: node tools/test-ownership.js
      - name: Audit entries written offline survive and upload
        run: node tools/test-audit-sync.js
      - name: Units of measure are shared and preserve imported values
        run: node tools/test-uom.js
      - name: Every tab renders something
        run: node tools/check-tab-coverage.js
      - name: Bulk upload mode expires and fails closed
        run: node tools/test-bulk-mode.js src/db.js
      - name: SOW Breakdown - taskId survives a load round-trip
        run: node tools/test-taskid-remap.js src/App.js
      - name: SOW Breakdown - row cost formulas
        run: node tools/test-row-cost.js src/App.js
      - name: SOW Breakdown - parent roll-up and breakdown notes
        run: node tools/test-sow-rollup.js src/App.js
      - name: Scope Library aligns with SOW Breakdown
        run: node tools/test-scopelib.js src/App.js
      - name: Check CE - pre-flight rules
        run: node tools/test-preflight.js src/App.js
      - name: A CE keeps every field through SharePoint and back
        run: node tools/test-ce-roundtrip.js
      - name: Detailed Excel export mirrors the printed CE
        run: node tools/test-xlsx-export.js src/App.js
      - name: Every host the app calls is allowed by the CSP
        run: node tools/check-csp-connect.js
      - name: A model the key cannot reach falls back to one it can
        run: node tools/test-ai-fallback.js
      - name: AI output still fits the app data model
        run: node tools/test-ai-plan.js src/ai.js
      - name: Saved-total recompute agrees with the editor
        run: node tools/test-recompute.js
