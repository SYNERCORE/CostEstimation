name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax + render tree structure
        run: node tools/check-render-tree.js
      - name: No calls to undefined project functions
        run: node tools/check-undefined-calls.js
      - name: Service worker precaches every app script
        run: node tools/check-sw-precache.js
      - name: Printed CE escapes all user text
        run: node tools/check-print-escaping.js
      - name: The two Status fields map onto each other
        run: node tools/check-status-sync.js
      - name: Status has its own action, with a full change history
        run: node tools/test-status-cell.js
      - name: Every status change is logged with who and when
        run: node tools/test-status-log.js
      - name: Every SharePoint column written is one the app creates
        run: node tools/check-sp-schema.js
      - name: A missing SharePoint column does not swallow a whole CE
        run: node tools/test-schema-gap.js
      - name: Every filtered SharePoint column is indexed
        run: node tools/check-sp-indexes.js
      - name: A CE still opens when its list is past the view threshold
        run: node tools/test-threshold-fallback.js
      - name: A browser-only save is not reported as an import
        run: node tools/test-save-reporting.js
      - name: CEs whose line items never saved can be found
        run: node tools/test-header-only-sweep.js
      - name: Default notes and signatories never overwrite typed work
        run: node tools/test-ce-defaults.js
      - name: The masterlist template round-trips through import
        run: node tools/test-ml-template.js
      - name: Every masterlist edit is persisted, not just held in state
        run: node tools/test-masterlist-persist.js
      - name: No editor remounts itself on every render
        run: node tools/check-logic-unchanged.js
      - name: Remounting editors
        run: node tools/check-remounting-editors.js
      - name: Monitoring focus
        run: node tools/test-monitoring-focus.js
      - name: Monitoring filters
        run: node tools/test-monitoring-filters.js
      - name: Every CE can be downloaded for offline use
        run: node tools/test-offline-prefetch.js
      - name: One throttle gate holds back every SharePoint caller
        run: node tools/test-throttle-gate.js
      - name: Token storm
        run: node tools/test-token-storm.js
      - name: A throttled SharePoint is waited out, not hammered
        run: node tools/test-throttling.js
      - name: Opening the Users tab does not reprovision the site
        run: node tools/test-users-tab-mount.js
      - name: Saving the Scope Library replaces, it does not merge
        run: node tools/test-sowlib-replace.js
      - name: The Scope Library survives its own export
        run: node tools/test-scopelib-roundtrip.js
      - name: Tools are filed by what they do
        run: node tools/test-tool-categories.js
      - name: Material categories
        run: node tools/test-material-categories.js
      - name: The tools template carries the tier figures
        run: node tools/test-tools-template.js
      - name: Tool tier pricing reproduces the masterlist workbook
        run: node tools/test-tool-tiers.js
      - name: Printing a previous CE does not disturb the open one
        run: node tools/test-print-without-loading.js
      - name: A saved CE keeps its quoted cost until Sync Rates is pressed
        run: node tools/test-sync-rates.js
      - name: Rate history
        run: node tools/test-rate-history.js
      - name: Masterlist price fill
        run: node tools/test-ml-fill-prices.js
      - name: Masterlist rounding
        run: node tools/test-ml-rounding.js
      - name: Deadline countdown
        run: node tools/test-deadline-countdown.js
      - name: Open CE definition
        run: node tools/test-open-ce.js
      - name: CE numbering
        run: node tools/test-ce-numbering.js
      - name: Company column
        run: node tools/test-company-column.js
      - name: Theme
        run: node tools/test-theme.js
      - name: Section headers
        run: node tools/test-section-headers.js
      - name: Shift bars
        run: node tools/test-shift-bars.js
      - name: Monitoring attachments
        run: node tools/test-attachments.js
      - name: Persistence audit
        run: node tools/test-persistence-audit.js
      - name: Highlighted costs
        run: node tools/test-highlighted-costs.js
      - name: CE revisions
        run: node tools/test-ce-revisions.js
      - name: Manpower totals
        run: node tools/test-manpower-totals.js
      - name: Number boxes
        run: node tools/test-numbox.js

      - name: A helper declared in render must not be rendered as a component
        run: node tools/test-inline-components.js src/App.js

      - name: Scope of Work deletions are undoable
        run: node tools/test-sow-undo.js src/App.js

      - name: Masterlist saves merge instead of overwriting
        run: node tools/test-masterlist-merge.js

      - name: Monitoring edits merge per field
        run: node tools/test-monitoring-merge.js

