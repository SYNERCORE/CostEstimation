      - name: Shared CE sequence
        run: node tools/test-ce-seq-shared.js
      - name: Mobilization manpower
        run: node tools/test-mob-manpower.js
      - name: CE save and load round trip
        run: node tools/test-ce-roundtrip.js
      - name: ECC once per person per month
        run: node tools/test-ecc-monthly.js
      - name: Sync UOM
        run: node tools/test-sync-uom.js
      - name: Export totals line up
        run: node tools/test-export-totals.js
      - name: Remarks trail
        run: node tools/test-remarks-trail.js
      - name: Approval routing
        run: node tools/test-approval.js
      - name: Masterlist trash
        run: node tools/test-ml-trash.js
      - name: Leftover rows are not counted
